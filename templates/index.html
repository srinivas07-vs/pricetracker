<!DOCTYPE html>
<html>
<head>
    <title>Price Tracker</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f9;
            text-align: center;
            margin-top: 60px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>🛒 Price Tracker Website</h2>

        <form method="POST">
            <input type="text" name="product" placeholder="Enter Product Name" required><br>
            <input type="number" name="price" placeholder="Enter Current Price" required><br>
            <button type="submit">Check Price</button>
        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        {% if old_price %}
            <p>Previous Price: ₹{{ old_price }}</p>
        {% endif %}

    </div>

</body>
</html>
